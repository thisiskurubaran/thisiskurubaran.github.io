<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <style>
      :root { color-scheme: light dark; --fg: #111413; --muted: #5b6361; --bg: #fcfcfb; --line: #e2e2df; --link: #1d4ed8; --code: #f3f3f1; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f1f3f2; --muted: #a3aaa7; --bg: #0d0f0e; --line: #272c2a; --link: #7c9bff; --code: #1c201e; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 2em; line-height: 1.2; margin: 0 0 0.5em; }
      h2 { font-size: 1.35em; margin: 2em 0 0.5em; padding-bottom: 0.25em; border-bottom: 1px solid var(--line); }
      a { color: var(--link); }
      code { background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
      table { width: 100%; border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
      th, td { text-align: left; vertical-align: top; padding: 8px 10px; border: 1px solid var(--line); }
      th { background: var(--code); }
      /* "What goes where" tables ({: .sent } after the table): one block per row on phones. */
      @media (max-width: 600px) {
        table.sent, table.sent tbody, table.sent tr, table.sent td { display: block; width: 100%; }
        table.sent { border: 0; }
        table.sent thead { display: none; }
        table.sent tr { padding: 12px 0; border-top: 1px solid var(--line); }
        table.sent td { border: 0; padding: 2px 0; }
        table.sent td:first-child { font-weight: 600; }
        table.sent td:nth-child(2)::before { content: "Sent: "; color: var(--muted); }
        table.sent td:nth-child(3)::before { content: "To: "; color: var(--muted); }
      }
      footer { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 0.9em; }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
    <footer>© {{ site.time | date: "%Y" }} Kurubaran Anandhan · <a href="/">All apps</a></footer>
  </body>
</html>
